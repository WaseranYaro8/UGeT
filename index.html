async function pollUpgrade(){if(document.hidden)return;try{const r=await api("/api/state",{},9000);const d=r.data;$("#noticeLine").textContent=d.notice||"";if(d.features)applyFeatures(d.features);const a=d.announcement;if(a&&a.id!==lastAnn&&a.until*1000>Date.now()){lastAnn=a.id;store.set("uget.ann",a.id);showAnn(a)}if(!a)$("#annBanner").classList.remove("on")}catch(e){}}
setInterval(pollUpgrade,4000);
const _loadCfg=loadCfg;
loadCfg=async function(){const ok=await _loadCfg();if(ok){try{const r=await api("/api/config",{headers:{"X-Admin":adminTok}});$("#featAI").checked=r.data.feat_ai!==false;$("#featChat").checked=r.data.feat_chat!==false;$("#featUpload").checked=r.data.feat_upload!==false;$("#noticeInput").value=r.data.notice||"";$("#annLevel").value=r.data.ann_level||"info"}catch(e){}}return ok};
async function admPost(body,msg){const st=$("#admStatus2");st.textContent="...";st.className="status";try{const r=await api("/api/config",{method:"POST",headers:{"Content-Type":"application/json","X-Admin":adminTok},body:JSON.stringify(body)},20000);if(r.data.ok){st.textContent=msg;st.className="status ok";toast(msg);pollUpgrade()}else{st.textContent=msgFor(r.data);st.className="status err";if(r.status===403)doLock()}}catch(e){st.textContent=t("err.net");st.className="status err"}}
$("#annSend").onclick=()=>{const v=$("#annInput").value.trim();if(!v){toast(t("adm.annPh"),1);return}admPost({ann_text:v,ann_level:$("#annLevel").value,ann_seconds:+$("#annSec").value},t("adm.sent")).then(()=>{$("#annInput").value=""})};
$("#annClear").onclick=()=>admPost({ann_text:""},t("adm.cleared"));
$("#admSave2").onclick=()=>admPost({notice:$("#noticeInput").value.trim(),feat_ai:$("#featAI").checked,feat_chat:$("#featChat").checked,feat_upload:$("#featUpload").checked},t("adm.saved"));
const _applyLang=applyLang;
applyLang=function(){_applyLang();$("#uidBadge").title=t("ai.space");if(MODELS.length)$("#modelSel").value=cfg.model};
loadModels();pollUpgrade();applyLang();


/* ==== UGET_UPGRADE_V3 ==== */
Object.assign(I18N.ja,{"up.any":"画像はどの形式でもOK(自動でPNG化) / 音声 mp3,ogg,wav,flac / モデル fbx,gltf,glb,rbxm,rbxmx / 動画 mp4,mov / アニメ rbxm,rbxmx ・1ファイル20MB","up.queue":"待機","up.conv":"変換中","up.up":"送信中","up.wait":"Roblox処理中","up.oks":"件 発行完了","up.paste":"画像を貼り付け(Ctrl+V)でも追加できます","up.multi":"複数ファイル同時選択OK"});
Object.assign(I18N.en,{"up.any":"Any image format (auto-converted to PNG) / Audio mp3,ogg,wav,flac / Model fbx,gltf,glb,rbxm,rbxmx / Video mp4,mov / Anim rbxm,rbxmx · 20MB each","up.queue":"queued","up.conv":"converting","up.up":"uploading","up.wait":"processing","up.oks":" created","up.paste":"You can also paste images (Ctrl+V)","up.multi":"Multiple files supported"});
let upQ=[],upRun=false;
function upRowEl(it,i){const d=document.createElement('div');d.className='uprow'+(it.status==='done'?' done':it.status==='err'?' err':'');d.style.animationDelay=Math.min(i*40,300)+'ms';if(it.thumb){const im=document.createElement('img');im.src=it.thumb;d.appendChild(im)}else{const ic=document.createElement('span');ic.innerHTML=icon('file');d.appendChild(ic.firstChild)}const n=document.createElement('span');n.className='un';n.textContent=it.name;d.appendChild(n);if(it.id){const u=document.createElement('span');u.className='uid';u.textContent=it.id;d.appendChild(u);const c=document.createElement('button');c.className='chip';c.innerHTML=icon('copy');c.onclick=()=>copyText(it.id);d.appendChild(c);const o=document.createElement('a');o.className='chip';o.href='https://www.roblox.com/library/'+it.id;o.target='_blank';o.rel='noopener';o.innerHTML=icon('external');d.appendChild(o)}const s=document.createElement('span');s.className='us';s.textContent=it.msg||t('up.queue');d.appendChild(s);return d}
function upRender(){const b=$('#upList');b.innerHTML='';upQ.forEach((it,i)=>b.appendChild(upRowEl(it,i)))}
function toPngB64(f,max){max=max||2048;return fileToDataURL(f).then(u=>new Promise((res,rej)=>{const im=new Image();im.onload=()=>{try{const sc=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*sc));c.height=Math.max(1,Math.round(im.height*sc));c.getContext('2d').drawImage(im,0,0,c.width,c.height);res({b64:c.toDataURL('image/png').split(',')[1],thumb:c.toDataURL('image/png')})}catch(e){rej(e)}};im.onerror=rej;im.src=u}))}
async function upAdd(files){const st=$('#upStatus');let added=0;for(const f of Array.from(files||[])){if(!f)continue;const base=f.name.replace(/\.[^.]+$/,'').slice(0,44)||'asset';if(/^image\//.test(f.type||'')||/\.(png|jpe?g|bmp|tga|webp|gif|avif|heic|heif)$/i.test(f.name)){if(f.size>20*1024*1024){upQ.push({name:f.name,status:'err',msg:t('up.tooLarge')});continue}const it={name:base+'.png',file:f,assetType:'Decal',ctype:'image/png',status:'conv',msg:t('up.conv')};upQ.push(it);added++;upRender();try{const r=await toPngB64(f);it.b64=r.b64;it.thumb=r.thumb;it.status='queue';it.msg=t('up.queue')}catch(e){it.status='err';it.msg=t('err.file')}upRender();continue}const d=detect(f);if(!d){upQ.push({name:f.name,status:'err',msg:t('up.badType')});continue}if(f.size>20*1024*1024){upQ.push({name:f.name,status:'err',msg:t('up.tooLarge')});continue}const ty=($('#upType').value==='Animation'&&/\.(rbxm|rbxmx)$/i.test(f.name))?'Animation':d[0];upQ.push({name:base,file:f,assetType:ty,ctype:(ty==='Animation'?'model/x-rbxm':d[1]),status:'queue',msg:t('up.queue')});added++}upRender();if(added){st.textContent=added+' '+t('up.queue');st.className='status'}}
async function upOne(it,idx){it.status='up';it.msg=t('up.up');upRender();try{if(!it.b64){const buf=await it.file.arrayBuffer();it.b64=bufToB64(buf)}const nm=($('#upName').value.trim()||it.name).slice(0,44)+(upQ.length>1?'-'+(idx+1):'');const r=await api('/api/upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:nm,desc:$('#upDesc').value.trim(),assetType:it.assetType,ctype:it.ctype,filename:it.name,data:it.b64})},120000);if(!r.data.op)throw Object.assign(new Error(),{code:r.data.error||'upstream'});it.msg=t('up.wait');upRender();let res=null;for(let i=0;i<100;i++){await new Promise(z=>setTimeout(z,3000));const s=await api('/api/upload/status?op='+encodeURIComponent(r.data.op),{},30000);if(s.data.done){res=s.data;break}}if(!res)throw Object.assign(new Error(),{code:'upstream'});if(res.error)throw Object.assign(new Error(),{code:res.error});it.id=res.assetId;it.status='done';it.msg=t('up.ok');let hh=store.get('uget.uploads',[]);if(!Array.isArray(hh))hh=[];store.set('uget.uploads',[{name:nm,id:res.assetId},...hh].slice(0,10));$('#upId').textContent=res.assetId;$('#upOpenLink').href='https://www.roblox.com/library/'+res.assetId;$('#upMod').textContent=res.moderation?t('up.moderation')+res.moderation:'';$('#upResult').classList.add('on')}catch(e){it.status='err';it.msg=e.code==='not_configured'?t('up.needCfg'):msgFor({error:e.code},'up.fail')}upRender()}
async function upRunAll(){if(upRun)return;const st=$('#upStatus');const pend=upQ.filter(x=>x.status==='queue');if(!pend.length){st.textContent=t('up.noFile');st.className='status err';return}upRun=true;$('#upBtn').disabled=true;$('#upProg').classList.add('on');let n=0;for(let i=0;i<upQ.length;i++){if(upQ[i].status!=='queue')continue;await upOne(upQ[i],i);if(upQ[i].id)n++}upRun=false;$('#upBtn').disabled=false;$('#upProg').classList.remove('on');st.textContent=n+'/'+pend.length+t('up.oks');st.className=n?'status ok':'status err';if(n)toast(n+t('up.oks'));renderHist()}
(function(){for(const id of ['drop','upFile','upBtn','upType']){const el=$('#'+id);if(!el)continue;const cl=el.cloneNode(true);el.parentNode.replaceChild(cl,el)}
const dz=$('#drop');const sub=dz.querySelector('.drop-sub');if(sub)sub.setAttribute('data-i18n','up.any');
$('#drop').onclick=()=>$('#upFile').click();
$('#upFile').onchange=e=>{upAdd(e.target.files);e.target.value=''};
['dragover','dragenter'].forEach(ev=>$('#drop').addEventListener(ev,e=>{e.preventDefault();$('#drop').classList.add('over')}));
['dragleave','drop'].forEach(ev=>$('#drop').addEventListener(ev,e=>{e.preventDefault();$('#drop').classList.remove('over')}));
$('#drop').addEventListener('drop',e=>{if(e.dataTransfer&&e.dataTransfer.files)upAdd(e.dataTransfer.files)});
$('#upBtn').onclick=upRunAll;
addEventListener('paste',e=>{if(curTab!=='upload')return;const fs=[];for(const it of (e.clipboardData&&e.clipboardData.items)||[]){if(it.kind==='file'){const f=it.getAsFile();if(f)fs.push(f)}}if(fs.length){e.preventDefault();upAdd(fs)}});
const al=applyLang;applyLang=function(){al();const s=$('#drop').querySelector('.drop-sub');if(s)s.textContent=t('up.any')};applyLang();
})();


/* ==== UGET_UPGRADE_V4 ==== */
function imgHints(u){return new Promise(res=>{const im=new Image();im.onload=()=>{try{const c=document.createElement('canvas');c.width=32;c.height=32;const x=c.getContext('2d');x.drawImage(im,0,0,32,32);const d=x.getImageData(0,0,32,32).data;let r=0,g=0,b=0,n=0,mx=0,mn=255;for(let i=0;i<d.length;i+=4){if(d[i+3]<40)continue;const R=d[i],G=d[i+1],B=d[i+2];r+=R;g+=G;b+=B;n++;const l=(R+G+B)/3;if(l>mx)mx=l;if(l<mn)mn=l}if(!n){res("");return}r/=n;g/=n;b/=n;const NM=[[255,80,80,"red"],[255,160,60,"orange"],[255,230,90,"yellow"],[90,200,110,"green"],[80,180,255,"blue"],[150,110,230,"purple"],[255,140,190,"pink"],[150,110,70,"brown"],[240,240,240,"white"],[40,40,40,"black"],[150,150,150,"gray"]];let best="gray",bd=1e9;for(const q of NM){const dd=(r-q[0])*(r-q[0])+(g-q[1])*(g-q[1])+(b-q[2])*(b-q[2]);if(dd<bd){bd=dd;best=q[3]}}const sat=Math.max(r,g,b)-Math.min(r,g,b);res([best,sat<30?"neutral":"vivid",(mx+mn)/2>150?"bright":"dark","icon"].join(" "))}catch(e){res("")}};im.onerror=()=>res("");im.src=u})}
(function(){const prev=visualSearch;visualSearch=async function(){const f=$("#img").files[0];if(!visImg&&!f){toast(t("err.noFile"),1);return}if(!visImg&&f){try{showPreview(await downscale(await fileToDataURL(f),1024),f.name)}catch(e){toast(t("err.file"),1);return}}if(!$("#visHint").value.trim()&&visImg){const auto=await imgHints(visImg);if(auto)$("#visHint").value=auto}return prev()};$("#imgBtn").onclick=visualSearch;$("#visBtn").onclick=visualSearch;$("#visHint").onkeydown=e=>{if(e.key==="Enter"&&!e.isComposing)visualSearch()}})();
(function(){const prev=upRunAll;upRunAll=async function(){if(upRun)return;const st=$("#upStatus");const pend=upQ.filter(x=>x.status==="queue");if(!pend.length){st.textContent=t("up.noFile");st.className="status err";return}upRun=true;$("#upBtn").disabled=true;$("#upProg").classList.add("on");let n=0,blocked=false;for(let i=0;i<upQ.length;i++){if(upQ[i].status!=="queue")continue;await upOne(upQ[i],i);if(upQ[i].id)n++;else if(/混み|Busy/.test(upQ[i].msg||"")){blocked=true;for(let j=i+1;j<upQ.length;j++)if(upQ[j].status==="queue"){upQ[j].status="err";upQ[j].msg=t("err.rate")}upRender();break}}upRun=false;$("#upBtn").disabled=false;$("#upProg").classList.remove("on");st.textContent=n+"/"+pend.length+t("up.oks")+(blocked?" ("+t("err.rate")+")":"");st.className=n?"status ok":"status err";if(n)toast(n+t("up.oks"));renderHist()};$("#upBtn").onclick=upRunAll})();

})();
