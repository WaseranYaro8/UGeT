async function upAdd(files){for(const f of Array.from(files||[])){if(!f)continue;const base=f.name.replace(/\.[^.]+$/,'').slice(0,44)||'asset';if(/^image\//.test(f.type||'')||/\.(png|jpe?g|bmp|tga|webp|gif|avif|heic|heif)$/i.test(f.name)){if(f.size>20*1024*1024){upQ.push({name:f.name,state:'err',msg:T('up.tooLarge')});continue}const it={name:base+'.png',file:f,assetType:'Decal',ctype:'image/png',state:'conv',msg:T('up.conv')};upQ.push(it);upRender();try{const u=await resizeImg(await toDataURL(f),2048,true);it.b64=u.split(',')[1];it.thumb=u;it.state='queue';it.msg=T('up.queue')}catch(e){it.state='err';it.msg=T('err.file')}upRender();continue}const d=detect(f);if(!d){upQ.push({name:f.name,state:'err',msg:T('up.badType')});continue}if(f.size>20*1024*1024){upQ.push({name:f.name,state:'err',msg:T('up.tooLarge')});continue}const ty=($('#upType').value==='Animation'&&/\.(rbxm|rbxmx)$/i.test(f.name))?'Animation':d[0];upQ.push({name:base,file:f,assetType:ty,ctype:ty==='Animation'?'model/x-rbxm':d[1],state:'queue',msg:T('up.queue')})}upRender()}

const seaOf=m=>m>=3&&m<=5?'spring':m>=6&&m<=8?'summer':m>=9&&m<=11?'autumn':'winter',sea=()=>cfg.season==='auto'?seaOf(new Date().getMonth()+1):cfg.season;
function palAt(h){let i=0;while(i<TK.length-2&&h>TK[i+1].h)i++;const a=TK[i],b=TK[i+1];let x=cl((h-a.h)/(b.h-a.h),0,1);x=x*x*(3-2*x);const o={};for(const f of['s0','s1','s2','s3','sun','acc'])o[f]=mix(a.p[f],b.p[f],x);return o}

function resize(){DPR=Math.min(devicePixelRatio||1,1.75);W=innerWidth;H=innerHeight;cv.width=W*DPR|0;cv.height=H*DPR|0;cx.setTransform(DPR,0,0,DPR,0,0);stars=[];for(let i=0;i<140;i++)stars.push({x:Math.random()*W,y:Math.random()*H*.6,r:.6+Math.random(),s:.5+Math.random()*2,p:Math.random()*TAU});const mk=(sd,b,a)=>{const p=[];for(let x=-80;x<=W+80;x+=26)p.push([x,b+Math.sin(x*.006+sd)*a+Math.sin(x*.017+sd*2.7)*a*.35]);return p};rF=mk(37,H*.62,H*.035);rN=mk(71,H*.76,H*.05)}
